trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageRepository: 'keteora-ordermgmt'
  containerRegistry: 'acrketeora2026.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/app/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build, Scan & Push Stage
    jobs:
      - job: BuildAndScan
        displayName: Build Docker Image and Run Security Scan
        steps:
          - task: Docker@2
            displayName: Build Docker Image
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              tags: |
                $(tag)
                latest

          - script: |
              echo "Installing Trivy security scanner..."
              sudo apt-get install wget apt-transport-https gnupg lsb-release -y
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
              echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
              sudo apt-get update
              sudo apt-get install trivy -y
              
              echo "Running Trivy image scan for vulnerabilities..."
              trivy image --severity HIGH,CRITICAL $(imageRepository):$(tag)
            displayName: 'Task 2.2: Trivy Security Vulnerability Scan'

          - task: Docker@2
            displayName: Push Image to ACR
            inputs:
              containerRegistry: 'ACR-Service-Connection'
              repository: $(imageRepository)
              command: push
              tags: |
                $(tag)
                latest

          - task: PublishPipelineArtifact@1
            displayName: Publish Kubernetes Manifests
            inputs:
              targetPath: '$(Build.SourcesDirectory)/manifests'
              artifact: 'manifests'

  - stage: Deploy
    displayName: Deploy Stage
    dependsOn: Build
    jobs:
      - deployment: DeployToAKS
        displayName: Deploy to AKS Cluster
        environment: 'KeteOra-Production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@0
                  displayName: Deploy Manifests to AKS
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: 'AKS-Service-Connection'
                    manifests: |
                      $(Pipeline.Workspace)/manifests/deployment.yaml
                      $(Pipeline.Workspace)/manifests/service.yaml
                    containers: |
                      $(containerRegistry)/$(imageRepository):$(tag)
